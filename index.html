
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apprenticeship Contact Manager</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f2f6f3;color:#1b2921;font:16px -apple-system,BlinkMacSystemFont,Arial,sans-serif}
header{background:#164d36;color:white;padding:22px 16px}
h1{font-size:25px;margin:0 0 8px}
header p{margin:0;font-size:14px}
main{max-width:800px;margin:auto;padding:14px}
input,select,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #ccd8d0;width:100%;margin:5px 0}
button{background:#176b49;color:white;border:0;font-weight:600}
button.secondary{background:#e2eee6;color:#174c35}
.card{background:white;border:1px solid #dce5df;border-radius:14px;padding:15px;margin:12px 0;overflow-wrap:anywhere}
.card h3{margin:9px 0}
.small{font-size:13px;color:#56675d;line-height:1.5}
.email{color:#176b49;overflow-wrap:anywhere}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.actions button{flex:1;min-width:110px;font-size:14px}
.stats{display:flex;gap:8px;margin:12px 0}
.stat{background:white;border-radius:10px;padding:12px;flex:1;text-align:center}
.stat strong{display:block;font-size:22px}
label{display:block;font-size:14px;font-weight:600;margin-top:10px}
a{overflow-wrap:anywhere}
hr{border:0;border-top:1px solid #e0e7e2}
</style>
</head>
<body>
<header>
<h1>Apprenticeship Contact Manager</h1>
<p>Automotive · Heavy Diesel · Agricultural Machinery</p>
<p>For Sukhraj Singh · Thames, New Zealand</p>
</header>
<main>
<div class="stats">
<div class="stat"><strong id="total">0</strong><span class="small">Contacts</span></div>
<div class="stat"><strong id="done">0</strong><span class="small">Contacted</span></div>
</div>

<input id="search" placeholder="Search employer, email, trade or town">
<select id="trade">
<option value="">All trades</option>
<option>Automotive</option>
<option>Heavy Diesel</option>
<option>Agricultural Machinery</option>
<option>Training</option>
</select>
<div id="list"></div>

<div class="card">
<h2>Add an employer</h2>
<label>Business name</label><input id="name" placeholder="Employer name">
<label>Email address</label><input id="email" type="email" placeholder="jobs@example.co.nz">
<label>Region or town</label><input id="region" placeholder="Waikato">
<label>Trade</label>
<select id="kind">
<option>Automotive</option><option>Heavy Diesel</option>
<option>Agricultural Machinery</option><option>Training</option>
</select>
<button id="add">Add contact</button>
<button class="secondary" id="export">Export contact backup (CSV)</button>
<p class="small">Your added contacts and contacted status are saved in this browser when local storage is available. Export a backup regularly.</p>
</div>
</main>
<script>
const original = [
["Komatsu NZ","apprentice@komatsu.co.nz","Nationwide","Heavy Diesel","Ask about current apprentice intake."],
["Automotive Employment NZ","info@automotiveemployment.co.nz","Nationwide","Automotive","Ask to be considered for workshop apprenticeships."],
["Fulton Hogan","careers@fultonhogan.com","Nationwide","Heavy Diesel","Ask about plant, fleet and diesel apprenticeship roles."],
["Higgins Group NZ","careers@higgins.co.nz","Nationwide","Heavy Diesel","Ask about plant mechanic and diesel trainee pathways."],
["NZ Army Careers","army.careers@nzdf.mil.nz","Nationwide","Heavy Diesel","Ask about Vehicle Technician training."],
["Tesla NZ","careers.nz@tesla.com","Auckland / Wellington","Automotive","Check the official careers page for current roles."],
["Qube NZ","nz.hr@qube.com.au","Auckland / Tauranga / Gisborne","Heavy Diesel","Ask about diesel mechanic trainee opportunities."],
["Pitstop Greenlane","greenlane@pitstop.co.nz","Auckland","Automotive","Ask about junior mechanic or apprenticeship pathways."],
["Brandt NZ","careers@brandt.ca","Hamilton / Auckland","Agricultural Machinery","Ask about service technician apprenticeships."],
["Giltrap AgriZone","info@gaz.co.nz","Waikato / NZ branches","Agricultural Machinery","Ask about current apprentice opportunities."],
["Kiwi Bus Builders","info@kiwibus.co.nz","Tauranga","Heavy Diesel","Ask about trainee mechanical roles."],
["Commercial Vehicle Centre Nelson","service@cvcnelson.co.nz","Nelson","Heavy Diesel","Ask about heavy vehicle workshop opportunities."],
["Driveline Ltd","driveline@xtra.co.nz","Christchurch","Heavy Diesel","Ask about entry-level diesel engine work."],
["Drive Group Corporation","info@drivegroup.co.nz","Christchurch","Automotive","Ask about current workshop opportunities."],
["Pitstop NZ","hr@pitstop.co.nz","Nationwide","Automotive","Ask about apprenticeship opportunities near you."],
["Air New Zealand Engineering","careers@airnewzealand.co.nz","Nationwide","Automotive","Ask about mechanical engineering pathways."],
["Transport Repairs Ltd","careers@transportrepairs.co.nz","South Island","Heavy Diesel","Official apprenticeship enquiries: check current intake."],
["Road Metals","jobs@roadmetals.co.nz","Multiple NZ locations","Heavy Diesel","Ask about plant and diesel trainee roles."],
["CAL Isuzu","info@calisuzu.co.nz","Waikato / Auckland","Heavy Diesel","Ask about truck workshop apprenticeships."],
["Emmetts Truck Services","admin@emmettswg.co.nz","Whanganui","Heavy Diesel","Ask about apprentice technician opportunities."],
["Firth and Stephenson","firthandstephenson@xtra.co.nz","Waikato","Agricultural Machinery","Ask whether an apprenticeship is currently available."],
["Landpower / CLAAS Harvest Centre","careers@landpower.co.nz","Nationwide","Agricultural Machinery","Ask about agricultural service trainee roles."],
["Power Farming","HRadmin@powerfarming.co.nz","Nationwide","Agricultural Machinery","Ask about workshop apprenticeships."],
["Automotive Careers NZ","info@acnzltd.co.nz","Nationwide","Training","Ask about entry-level workshop vacancies."],
["Automotive Academy","academy@supershoppes.co.nz","Auckland / Nationwide","Training","Ask about current training and workshop pathways."],
["Farmer Autovillage","info@farmerautovillage.co.nz","Tauranga","Automotive","Ask about technician apprenticeships."],
["GTT Mechanical","accounts@gttmechanical.co.nz","Cambridge","Heavy Diesel","Ask whether a trainee pathway is possible."],
["MITO Automotive Pathways","jodi.franklin@mito.org.nz","Nationwide","Training","Ask for employer and apprenticeship guidance."],
["MITO Learner Support","info@mito.org.nz","Nationwide","Training","Ask about connecting with apprenticeship employers."]
].map((x,i)=>({id:"base"+i,name:x[0],email:x[1],region:x[2],trade:x[3],notes:x[4]}));

let contacts = original.slice();
let contacted = [];
try {
 contacts = contacts.concat(JSON.parse(localStorage.getItem("apprenticeship_custom")||"[]"));
 contacted = JSON.parse(localStorage.getItem("apprenticeship_contacted")||"[]");
} catch(e) {}

const $ = id => document.getElementById(id);
function save(){
 try{
 localStorage.setItem("apprenticeship_custom",JSON.stringify(
 contacts.filter(c=>c.id.startsWith("custom"))
 ));
 localStorage.setItem("apprenticeship_contacted",JSON.stringify(contacted));
 }catch(e){}
}
function render(){
 const q=$("search").value.toLowerCase().trim();
 const trade=$("trade").value;
 const shown=contacts.filter(c=>
 (!q||[c.name,c.email,c.region,c.trade,c.notes].join(" ").toLowerCase().includes(q))&&
 (!trade||c.trade===trade)
 );
 $("total").textContent=contacts.length;
 $("done").textContent=contacted.length;
 $("list").innerHTML=shown.map(c=>`
 <article class="card">
 <div class="small">${esc(c.region)} · ${esc(c.trade)} ${contacted.includes(c.id)?"· ✓ Contacted":""}</div>
 <h3>${esc(c.name)}</h3>
 <a class="email" href="mailto:${encodeURIComponent(c.email)}">${esc(c.email)}</a>
 <p class="small">${esc(c.notes||"Check current opportunities before applying.")}</p>
 <div class="actions">
 <button data-email="${esc(c.id)}">Draft email</button>
 <button class="secondary" data-track="${esc(c.id)}">${contacted.includes(c.id)?"Unmark contacted":"Mark contacted"}</button>
 </div>
 </article>`).join("")||'<p>No matching contacts. Try a different search.</p>';
}
function esc(s){
 return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
$("search").addEventListener("input",render);
$("trade").addEventListener("change",render);
$("list").addEventListener("click",e=>{
 const id=e.target.dataset.track||e.target.dataset.email;
 if(!id)return;
 const c=contacts.find(x=>x.id===id);
 if(e.target.dataset.track){
 contacted=contacted.includes(id)?contacted.filter(x=>x!==id):contacted.concat(id);
 save();render();return;
 }
 if(c){
 const subject="Apprenticeship or trainee opportunity enquiry";
 const body=`Kia ora ${c.name} team,

My name is Sukhraj Singh and I live in Thames, Waikato. I am interested in an automotive, heavy diesel or mechanical apprenticeship/trainee opportunity.

I have hands-on experience as an optical fibre technician, commercial driving experience, a full Class 4 licence, and a strong focus on health and safety. I am keen to learn, work hard and develop a long-term career in the trade.

Are there any current or upcoming opportunities, or could you consider me for an entry-level position? I can provide my CV.

Kind regards,
Sukhraj Singh
0220405678
sukhraj96singh@gmail.com`;
 location.href="mailto:"+encodeURIComponent(c.email)+"?subject="+encodeURIComponent(subject)+"&body="+encodeURIComponent(body);
 }
});
$("add").addEventListener("click",()=>{
 const name=$("name").value.trim(), email=$("email").value.trim();
 if(!name||!email||!email.includes("@")){alert("Please enter a business name and valid email.");return;}
 if(contacts.some(c=>c.email.toLowerCase()===email.toLowerCase())){
 alert("That email is already in the list.");return;
 }
 contacts.push({id:"custom"+Date.now(),name,email,region:$("region").value.trim()||"Not specified",trade:$("kind").value,notes:"Added manually. Verify details and current opportunities."});
 save();$("name").value="";$("email").value="";$("region").value="";
 render();alert("Contact added.");
});
$("export").addEventListener("click",()=>{
 const rows=[["Business","Email","Region","Trade","Notes","Contacted"],...contacts.map(c=>[c.name,c.email,c.region,c.trade,c.notes,contacted.includes(c.id)?"Yes":"No"])];
 const csv=rows.map(r=>r.map(v=>'"'+String(v||"").replace(/"/g,'""')+'"').join(",")).join("\r\n");
 const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
 const url=URL.createObjectURL(blob);const a=document.createElement("a");
 a.href=url;a.download="apprenticeship-contacts.csv";a.click();URL.revokeObjectURL(url);
});
render();
</script>
</body>
</html>
